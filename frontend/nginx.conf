server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Gzip compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml
               image/svg+xml font/woff2;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Proxy /api/* → backend container ─────────────────────────────────────
    # React calls  /api/v1/auth/login
    # Nginx sends  http://backend:5001/api/v1/auth/login
    # No CORS — same origin from browser's perspective
    location /api/ {
        proxy_pass         http://backend:5001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Required for cookies (auth)
        proxy_set_header   Cookie $http_cookie;
        proxy_pass_header  Set-Cookie;

        # Allow large uploads (Sanad PDFs, booking docs — max 5 MB each)
        client_max_body_size 15m;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # ── Proxy /uploads/* → backend (serves stored PDFs / images) ─────────────
    location /uploads/ {
        proxy_pass         http://backend:5001;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_cache_valid  200 1d;
    }

    # ── Health check endpoint ─────────────────────────────────────────────────
    location /health {
        proxy_pass http://backend:5001;
    }

    # ── React app — serve index.html for all routes (React Router) ───────────
    location / {
        try_files $uri $uri/ /index.html;

        # Cache static assets aggressively (Vite adds content hash to filenames)
        location ~* \.(js|css|png|jpg|jpeg|svg|ico|woff2|woff|ttf)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }
    }
}
